[project]
name = "property-concierge"
version = "1.0.0"
description = "Grounded RAG assistant over DarGlobal developments and Wasalt Riyadh listings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.4",
    "pydantic>=2.7",
    "upstash-vector>=0.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "numpy>=1.26"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
